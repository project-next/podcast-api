services:
  podcast-api:
    image: "eclipse-temurin:25.0.5.1_2-jre-ubi10-minimal"
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:8080"
    volumes:
      - "./build/libs/podcast-api.jar:/podcast-api.jar:ro"
    tmpfs:
      - "/tmp:size=32m,mode=0700,uid=1000,gid=1000"
    command: ["java", "-XX:MaxRAMPercentage=50", "-XX:+ExitOnOutOfMemoryError", "-jar", "/podcast-api.jar"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 30s
      timeout: 3s
      start_period: 60s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 400M
          cpus: "1.0"
          pids: 128
    memswap_limit: 400M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - podcast-api
    environment:
      - LOG_LEVEL=INFO
      - SPRING_PROFILES_ACTIVE=docker
      - SSL_KEYSTORE_PASSWORD=${PODCAST_API_SSL_KEYSTORE_PASSWORD}
      - DB_HOST=${PODCAST_API_DB_HOST}
      - DB_PORT=${PODCAST_API_DB_PORT}
      - DB_NAME=${PODCAST_API_DB_NAME}
      - DB_USERNAME=${PODCAST_API_DB_USERNAME}
      - DB_PASSWORD=${PODCAST_API_DB_PASSWORD}
      - ADMIN_USERNAME=${PODCAST_API_ADMIN_USERNAME}
      - ADMIN_PASSWORD=${PODCAST_API_ADMIN_PASSWORD}
      - GENERIC_USER_USERNAME=${PODCAST_API_GENERIC_USER_USERNAME}
      - GENERIC_USER_PASSWORD=${PODCAST_API_GENERIC_USER_PASSWORD}
    labels:
      com.datadoghq.ad.init_configs: '[{}]'
      com.datadoghq.ad.instances: '[{"host":"%%host%%", "port": "%%port%%"}]'
      com.datadoghq.ad.logs: >-
        [{
          "source": "java", 
          "service": "podcast-api",
          "auto_multi_line_detection": true,
          "log_processing_rules": [{
            "type": "exclude_at_match",
            "name": "exclude_health_check",
            "pattern" : "/status"
          }]
        }]
      com.datadoghq.tags.env: 'prod'
      com.datadoghq.tags.service: 'podcast-api'

networks:
  podcast-api:
    name: podcast-api
    driver: bridge
    external: false